name: "📷 Photos for the website gallery"
description: Upload photos (phone or computer) with a caption. Published automatically for lab members.
title: "[Photo] "
body:
  - type: markdown
    attributes:
      value: "Tap **Attach files** (paperclip) in the Photos box to add one or more photos. Location data is removed automatically."
  - type: textarea
    id: photos
    attributes: { label: Photos, description: Attach one or more photos here., placeholder: "Attach photos here" }
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: What is this photo?
      options: ["Conference presentation or poster", "Graduation or thesis defense", "Award or recognition", "Talk, keynote or panel", "Lab event or group photo", "Field work, robots or experiments", "Outreach or teaching", "Something else"]
    validations: { required: true }
  - type: input
    id: paper
    attributes: { label: Paper presented (if any), description: Title of the paper or poster. }
  - type: input
    id: event
    attributes: { label: Event / conference / place, placeholder: "e.g. CVPR 2026, Nashville" }
  - type: input
    id: people
    attributes: { label: People in the photo (if relevant), description: "e.g. the graduate, the presenter" }
  - type: textarea
    id: caption
    attributes: { label: Caption, description: One or two sentences. }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: Date, placeholder: "June 2026" }
  - type: input
    id: link
    attributes: { label: Related link (optional), placeholder: "https://..." }
  - type: input
    id: credit
    attributes: { label: Photo credit, value: "Photo: Soumik Sarkar" }
