name: "📰 Lab news"
description: Paper accepted, award, defense, talk, grant or event. Published automatically for lab members.
title: "[News] "
body:
  - type: dropdown
    id: type
    attributes: { label: Type, options: ["Paper accepted", "Award", "Thesis defense / graduation", "Talk or keynote", "New grant", "Event", "Other"] }
    validations: { required: true }
  - type: input
    id: headline
    attributes: { label: Headline }
    validations: { required: true }
  - type: textarea
    id: details
    attributes: { label: Details, description: One or two sentences. }
  - type: input
    id: date
    attributes: { label: Date, placeholder: "2026-10-03" }
    validations: { required: true }
  - type: input
    id: link
    attributes: { label: Link (optional) }
  - type: textarea
    id: image
    attributes: { label: Image (optional), description: Attach one image if you like. }
