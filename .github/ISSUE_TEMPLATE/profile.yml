name: "👤 Profile update"
description: Update your role, bio, interests, links or photo. Only the fields you fill in are changed. Applied automatically for lab members.
title: "[Profile] "
body:
  - type: input
    id: person
    attributes: { label: Your name, description: As it appears on the website. }
    validations: { required: true }
  - type: input
    id: headline
    attributes: { label: Role / headline, placeholder: "Ph.D. Candidate, Mechanical Engineering" }
  - type: input
    id: department
    attributes: { label: Department }
  - type: input
    id: position
    attributes: { label: Current position (alumni), placeholder: "Research Scientist, Company" }
  - type: input
    id: joined
    attributes: { label: Joined (term) }
  - type: textarea
    id: degrees
    attributes: { label: Degrees (new ones only), description: One per line. }
  - type: textarea
    id: bio
    attributes: { label: Bio (replaces the current one), description: Leave empty to keep the current bio. }
  - type: input
    id: interests
    attributes: { label: Research interests }
  - type: input
    id: homepage
    attributes: { label: Homepage }
  - type: input
    id: scholar
    attributes: { label: Google Scholar }
  - type: input
    id: github
    attributes: { label: GitHub }
  - type: input
    id: linkedin
    attributes: { label: LinkedIn }
  - type: input
    id: orcid
    attributes: { label: ORCID }
  - type: textarea
    id: other
    attributes: { label: Other links (one per line) }
  - type: textarea
    id: photo
    attributes: { label: Photo (new headshot), description: Attach only if you want to replace your photo. }
