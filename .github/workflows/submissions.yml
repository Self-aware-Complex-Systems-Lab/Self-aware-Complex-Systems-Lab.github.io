# Applies submissions committed by the token-based form (/contribute-token/). Members push with their own
# fine-grained token (write access to this repo), so the pusher is already authenticated by GitHub.
name: Submissions

on:
  push:
    branches: ["main"]
    paths: ["submissions/inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submissions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Apply submissions
        run: |
          pip install --quiet pillow
          python scripts/contribution_from_submission.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/assets src/data submissions
          if git diff --staged --quiet; then echo "Nothing to commit."; else
            git commit -m "Apply website submission(s) from @${{ github.actor }}"
            git pull --rebase --quiet origin main
            git push
          fi
